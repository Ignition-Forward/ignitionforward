# Elestio deployment configuration
# https://docs.elest.io/

config:
  runtime: docker-compose
  version: "1.0"

ports:
  - protocol: HTTPS
    targetProtocol: HTTP
    listeningPort: 443
    targetPort: 3000
    public: true

resources:
  cpu: 1
  memory: 512

healthCheck:
  protocol: HTTP
  path: /health
  port: 3000
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  successThreshold: 1
  failureThreshold: 3
