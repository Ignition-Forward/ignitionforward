<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Gradient for the forward arrow/flame -->
    <linearGradient id="forwardGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A962"/>
      <stop offset="100%" stop-color="#E8D5A3"/>
    </linearGradient>
    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Navy background with subtle rounded corners -->
  <rect width="32" height="32" rx="7" fill="#1A2332"/>

  <!-- Forward arrow / ignition mark - bold, confident -->
  <!-- Two chevrons stacked to create momentum/speed -->
  <g filter="url(#glow)">
    <!-- Primary forward chevron -->
    <path
      d="M10 22 L16 16 L10 10"
      fill="none"
      stroke="url(#forwardGrad)"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Secondary chevron - echo/momentum -->
    <path
      d="M17 22 L23 16 L17 10"
      fill="none"
      stroke="url(#forwardGrad)"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.6"
    />
  </g>

  <!-- Spark accent at the leading edge -->
  <circle cx="24" cy="16" r="1.5" fill="#F8F7F4" opacity="0.9"/>
</svg>
