services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    container_name: ignition-forward-frontend-dev
    restart: unless-stopped
    ports:
      - "4000:3000"
    volumes:
      # Mount entire project for hot reload (node_modules from container)
      - .:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:4003

  api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: ignition-forward-api-dev
    restart: unless-stopped
    ports:
      - "4003:3001"
    env_file:
      - .env
    volumes:
      - ./server.js:/app/server.js
    environment:
      - NODE_ENV=development
      - LOG_LEVEL=debug
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL:-hello@ignitionforward.com}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
